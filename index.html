<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TDX 範圍公車紀錄</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  html,body{margin:0;height:100%;font:14px/1.4 system-ui,"Noto Sans TC",sans-serif}
  #map{position:absolute;inset:0 0 0 320px}
  #panel{position:absolute;top:0;left:0;bottom:0;width:320px;box-sizing:border-box;padding:12px;overflow:auto;background:#fafafa;border-right:1px solid #ddd}
  h3{margin:12px 0 6px;font-size:14px}
  button{padding:6px 10px;margin:2px 2px 2px 0;cursor:pointer}
  input{width:100%;box-sizing:border-box;padding:5px;margin:2px 0}
  .row{display:flex;gap:6px;align-items:center}
  #log{font-size:12px;color:#444;white-space:pre-wrap;max-height:160px;overflow:auto;background:#fff;border:1px solid #ddd;padding:6px}
  table{border-collapse:collapse;width:100%;font-size:12px}
  td,th{border-bottom:1px solid #e5e5e5;padding:2px 4px;text-align:left}
  #tblwrap{max-height:220px;overflow:auto;background:#fff;border:1px solid #ddd}
  @media(max-width:700px){#map{left:0;top:55%}#panel{width:auto;right:0;bottom:45%;border-right:0}}
</style>
</head>
<body>
<div id="panel">
  <h3>1. TDX 金鑰（只在你的瀏覽器，直接連 TDX）</h3>
  <input id="cid" placeholder="Client ID" autocomplete="off">
  <input id="sec" placeholder="Client Secret" type="password" autocomplete="off">
  <label style="font-size:12px"><input type="checkbox" id="remember" style="width:auto"> 記住在此瀏覽器（共用電腦請勿勾選）</label><br>
  <button id="btnCfg">驗證</button><span id="cfgState"></span>

  <h3>2. 在地圖點選範圍（≥3 點）</h3>
  <button id="btnDraw">開始選點</button>
  <button id="btnUndo">↶ 清除上一點</button>
  <button id="btnDone" disabled>完成範圍</button>
  <button id="btnClear">清除</button>
  <div id="areaInfo" style="color:#666;font-size:12px"></div>

  <h3>範圍內只紀錄哪些地區的公車</h3>
  <div style="font-size:12px;color:#666">依「路線所屬縣市」判斷，例如在台中範圍內只勾「彰化縣」，就只紀錄彰化縣的公車。都不勾＝不限。</div>
  <div id="regions" style="display:grid;grid-template-columns:1fr 1fr;gap:2px;font-size:12px;margin:4px 0"></div>
  <button id="btnNoReg">清除地區勾選</button>

  <h3>3. 紀錄</h3>
  <div class="row">輪詢間隔(秒) <input id="interval" type="number" value="30" min="10" style="width:70px"></div>
  <button id="btnStart" disabled>開始紀錄</button>
  <button id="btnStop" disabled>停止</button>
  <div id="stat" style="margin-top:4px"></div>

  <h3>4. 匯出</h3>
  <button id="btnKml">匯出 KML</button>
  <button id="btnXlsx">匯出 Excel</button>

  <h3>目前紀錄</h3>
  <div id="tblwrap"><table><thead><tr><th>車牌</th><th>業者</th><th>地區</th><th>進入</th><th>狀態</th></tr></thead><tbody id="tb"></tbody></table></div>
  <h3>訊息</h3>
  <div id="log"></div>
</div>
<div id="map"></div>

<script>
const $ = id => document.getElementById(id);
const map = L.map('map').setView([25.04, 121.55], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(map);

let drawing = false, pts = [], markers = [], poly = null, area = null, busLayer = L.layerGroup().addTo(map);
let running = false, timer = null, polls = 0, apiCalls = 0;
const active = new Map();   // 車牌 -> 進行中的 session（目前在範圍內）
let sessions = [];          // 全部 session（含已離開）

const log = m => { const t = new Date().toLocaleTimeString(); $('log').textContent = `[${t}] ${m}\n` + $('log').textContent.slice(0, 4000); };
const fmt = d => { d = new Date(d); const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };

// ---------- 金鑰 ----------
const TOKEN_URL = 'https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token';
const API_URL = 'https://tdx.transportdata.tw/api/basic/v2/Bus/RealTimeByFrequency/NearBy';
let tok = null, tokExp = 0, nearCache = null;
try { $('cid').value = localStorage.getItem('tdx_id') || ''; $('sec').value = localStorage.getItem('tdx_sec') || ''; } catch (e) {}
const corsHint = e => e instanceof TypeError ? '瀏覽器無法連到 TDX（可能是 CORS 限制或網路問題）；若確定是 CORS，請改用 local/ 資料夾的本機版' : e.message;

async function getToken() {
  if (tok && Date.now() < tokExp - 60000) return tok;
  const id = $('cid').value.trim(), sec = $('sec').value.trim();
  if (!id || !sec) throw new Error('請輸入 Client ID / Secret');
  let r;
  try {
    r = await fetch(TOKEN_URL, {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams({grant_type: 'client_credentials', client_id: id, client_secret: sec})});
  } catch (e) { throw new Error(corsHint(e)); }
  if (!r.ok) throw new Error('取得 token 失敗 HTTP ' + r.status);
  const j = await r.json();
  tok = j.access_token; tokExp = Date.now() + (j.expires_in || 3600) * 1000;
  try { if ($('remember').checked) { localStorage.setItem('tdx_id', id); localStorage.setItem('tdx_sec', sec); } else { localStorage.removeItem('tdx_id'); localStorage.removeItem('tdx_sec'); } } catch (e) {}
  return tok;
}
// 10 秒內相同查詢直接用快取，不重複呼叫 TDX
async function fetchNearby(lat, lon, r) {
  const key = `${lat.toFixed(4)},${lon.toFixed(4)},${r}`;
  if (nearCache && nearCache.key === key && Date.now() - nearCache.t < 10000) return nearCache.data;
  const q = `$spatialFilter=${encodeURIComponent(`nearby(${lat.toFixed(6)},${lon.toFixed(6)},${r})`)}&$format=JSON`;
  let resp;
  try { resp = await fetch(`${API_URL}?${q}`, {headers: {Authorization: 'Bearer ' + await getToken()}}); }
  catch (e) { throw new Error(corsHint(e)); }
  if (resp.status === 401) { tok = null; throw new Error('token 失效，下次輪詢會自動更新'); }
  if (!resp.ok) throw new Error(`TDX HTTP ${resp.status}（429 代表額度或頻率超限）`);
  const data = await resp.json();
  apiCalls++;
  nearCache = {key, t: Date.now(), data};
  return data;
}
$('btnCfg').onclick = async () => {
  try { tok = null; await getToken(); $('cfgState').textContent = '✔ 驗證成功'; }
  catch (e) { $('cfgState').textContent = '✘ ' + e.message; }
};

// ---------- 地區篩選 ----------
const REGIONS = {TPE:'臺北市',NWT:'新北市',TAO:'桃園市',TXG:'臺中市',TNN:'臺南市',KHH:'高雄市',KEE:'基隆市',HSZ:'新竹市',HSQ:'新竹縣',MIA:'苗栗縣',CHA:'彰化縣',NAN:'南投縣',YUN:'雲林縣',CYI:'嘉義市',CYQ:'嘉義縣',PIF:'屏東縣',ILA:'宜蘭縣',HUA:'花蓮縣',TTT:'臺東縣',KIN:'金門縣',PEN:'澎湖縣',LIE:'連江縣',THB:'公路客運'};
const codeOf = uid => (/^[A-Z]+/.exec(uid || '') || [''])[0];
const regionOf = uid => { const c = codeOf(uid); return REGIONS[c] || (c ? '其他(' + c + ')' : '未知'); };
const selReg = () => new Set([...document.querySelectorAll('#regions input:checked')].map(i => i.value));
$('regions').innerHTML = Object.entries(REGIONS).map(([c, n]) => `<label><input type="checkbox" value="${c}" style="width:auto"> ${n}</label>`).join('');
$('btnNoReg').onclick = () => document.querySelectorAll('#regions input').forEach(i => i.checked = false);

// ---------- 選範圍 ----------
function redraw() {
  if (poly) map.removeLayer(poly);
  if (pts.length >= 2) poly = L.polygon(pts, {color: '#d33', weight: 2, fillOpacity: .12}).addTo(map);
  $('btnDone').disabled = pts.length < 3;
}
$('btnDraw').onclick = () => { drawing = true; map.getContainer().style.cursor = 'crosshair'; log('請在地圖上依序點選範圍頂點'); };
map.on('click', e => {
  if (!drawing) return;
  pts.push([e.latlng.lat, e.latlng.lng]);
  markers.push(L.circleMarker(e.latlng, {radius: 5, color: '#d33'}).addTo(map));
  redraw();
});
$('btnUndo').onclick = () => {
  if (running) return alert('請先停止紀錄');
  if (!pts.length) return;
  pts.pop(); const m = markers.pop(); if (m) map.removeLayer(m);
  if (area) { area = null; $('areaInfo').textContent = ''; $('btnStart').disabled = true; }
  drawing = true; map.getContainer().style.cursor = 'crosshair';
  redraw();
};
$('btnClear').onclick = () => {
  if (running) return alert('請先停止紀錄');
  pts = []; markers.forEach(m => map.removeLayer(m)); markers = []; if (poly) map.removeLayer(poly); poly = null;
  area = null; drawing = false; map.getContainer().style.cursor = ''; $('btnDone').disabled = true; $('btnStart').disabled = true; $('areaInfo').textContent = '';
};
$('btnDone').onclick = () => {
  drawing = false; map.getContainer().style.cursor = '';
  // 外接圓：重心 + 到最遠頂點的距離 → 一次 NearBy 呼叫涵蓋整個多邊形
  const cLat = pts.reduce((s, p) => s + p[0], 0) / pts.length, cLon = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  const c = L.latLng(cLat, cLon);
  const r = Math.ceil(Math.max(...pts.map(p => c.distanceTo(L.latLng(p[0], p[1])))) + 30);
  area = {lat: cLat, lon: cLon, r, poly: pts.map(p => [p[0], p[1]])};
  $('areaInfo').textContent = `${pts.length} 個頂點；查詢圓半徑約 ${r} 公尺` + (r > 20000 ? '（範圍很大，建議縮小以減少資料量）' : '');
  $('btnStart').disabled = false;
};

// 射線法：點是否在多邊形內
function inside(lat, lon, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [yi, xi] = poly[i], [yj, xj] = poly[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}

// ---------- 輪詢 ----------
async function poll() {
  if (!running) return;
  const now = new Date();
  try {
    const data = await fetchNearby(area.lat, area.lon, area.r);
    polls++;
    const seenInside = new Set(); const sel = selReg();
    busLayer.clearLayers();
    for (const b of data) {
      const lat = b.BusPosition?.PositionLat, lon = b.BusPosition?.PositionLon, plate = b.PlateNumb;
      if (lat == null || !plate || plate === '-1') continue;
      if (sel.size && !sel.has(codeOf(b.RouteUID))) continue;      // 地區篩選
      const gps = new Date(b.GPSTime || b.SrcUpdateTime || now);
      if (now - gps > 180000) continue;                       // 超過 3 分鐘沒更新視為失聯，不採計
      if (!inside(lat, lon, area.poly)) continue;
      seenInside.add(plate);
      L.circleMarker([lat, lon], {radius: 5, color: '#06c'}).bindTooltip(plate).addTo(busLayer);
      let s = active.get(plate);
      if (!s) {
        s = {plate, operator: b.OperatorID || '', route: b.SubRouteName?.Zh_tw || b.RouteName?.Zh_tw || '', direction: b.Direction,
             region: regionOf(b.RouteUID), entry: gps, exit: null, track: []};
        active.set(plate, s); sessions.push(s);
      }
      const last = s.track[s.track.length - 1];
      if (!last || +last.t !== +gps) s.track.push({t: gps, lat, lon});
    }
    // 離開範圍（或不在回傳中）→ 結束該筆，之後不再記錄
    for (const [plate, s] of active) if (!seenInside.has(plate)) { s.exit = now; active.delete(plate); }
    $('stat').textContent = `輪詢 ${polls} 次｜本次 TDX 實際呼叫累計 ${apiCalls}｜範圍內 ${active.size} 輛`;
    render(); save();
  } catch (e) { log('錯誤：' + e.message); }
  timer = setTimeout(poll, Math.max(10, +$('interval').value || 30) * 1000);
}
$('btnStart').onclick = () => { if (!area) return; running = true; $('btnStart').disabled = true; $('btnStop').disabled = false; log('開始紀錄'); poll(); };
$('btnStop').onclick = () => {
  running = false; clearTimeout(timer); const now = new Date();
  for (const [, s] of active) s.exit = now; active.clear();
  $('btnStart').disabled = false; $('btnStop').disabled = true; render(); save(); log('已停止');
};

// ---------- 顯示 / 暫存 ----------
function sorted() {
  return [...sessions].sort((a, b) => a.plate.localeCompare(b.plate) || a.operator.localeCompare(b.operator) || a.entry - b.entry);
}
function render() {
  $('tb').innerHTML = sorted().map(s => `<tr><td>${s.plate}</td><td>${s.operator}</td><td>${s.region || ""}</td><td>${fmt(s.entry).slice(5)}</td><td>${s.exit ? '已離開' : '範圍內'}</td></tr>`).join('');
}
function save() { try { localStorage.setItem('tdx_sessions', JSON.stringify(sessions)); } catch (e) {} }
try {
  const old = JSON.parse(localStorage.getItem('tdx_sessions') || '[]');
  if (old.length) { sessions = old.map(s => ({...s, entry: new Date(s.entry), exit: s.exit ? new Date(s.exit) : new Date(), track: s.track.map(p => ({...p, t: new Date(p.t)}))})); render(); log(`還原上次紀錄 ${sessions.length} 筆`); }
} catch (e) {}

// ---------- 匯出 ----------
function download(name, blobParts, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(blobParts, {type})); a.download = name; a.click();
}
const stamp = () => fmt(new Date()).replace(/[: -]/g, '').slice(0, 12);
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;'}[c]));

$('btnKml').onclick = () => {
  if (!sessions.length) return alert('目前沒有資料');
  const rows = sorted().map(s => {
    const exit = s.exit || new Date();
    const first = s.track[0] || {lat: 0, lon: 0};
    const ext = `<ExtendedData><Data name="車牌"><value>${esc(s.plate)}</value></Data><Data name="業者"><value>${esc(s.operator)}</value></Data>` +
      `<Data name="所屬地區"><value>${esc(s.region || "")}</value></Data><Data name="路線"><value>${esc(s.route)}</value></Data><Data name="進入時間"><value>${fmt(s.entry)}</value></Data><Data name="離開時間"><value>${fmt(exit)}</value></Data></ExtendedData>`;
    const coords = s.track.map(p => `${p.lon},${p.lat},0`).join(' ');
    return `<Folder><name>${esc(s.plate)} ${esc(s.operator)} ${fmt(s.entry)}</name>` +
      `<Placemark><name>${esc(s.plate)} 進入 ${fmt(s.entry)}</name>${ext}<TimeStamp><when>${s.entry.toISOString()}</when></TimeStamp><Point><coordinates>${first.lon},${first.lat},0</coordinates></Point></Placemark>` +
      (s.track.length > 1 ? `<Placemark><name>${esc(s.plate)} 軌跡</name>${ext}<TimeSpan><begin>${s.entry.toISOString()}</begin><end>${exit.toISOString()}</end></TimeSpan><LineString><tessellate>1</tessellate><coordinates>${coords}</coordinates></LineString></Placemark>` : '') +
      `</Folder>`;
  }).join('');
  const ring = [...area?.poly || pts, (area?.poly || pts)[0]].map(p => `${p[1]},${p[0]},0`).join(' ');
  const kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>範圍公車紀錄 ${stamp()}</name>` +
    `<Placemark><name>查詢範圍</name><Style><LineStyle><color>ff0000dd</color><width>2</width></LineStyle><PolyStyle><color>330000dd</color></PolyStyle></Style><Polygon><outerBoundaryIs><LinearRing><coordinates>${ring}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>${rows}</Document></kml>`;
  download(`bus_area_${stamp()}.kml`, [kml], 'application/vnd.google-earth.kml+xml');
};

$('btnXlsx').onclick = () => {
  if (!sessions.length) return alert('目前沒有資料');
  const list = sorted();
  const main = list.map(s => { const exit = s.exit || new Date(), f = s.track[0] || {};
    return {'車牌號碼': s.plate, '業者代碼': s.operator, '所屬地區': s.region || '', '路線': s.route, '方向': s.direction,
      '到站(進入範圍)時間': fmt(s.entry), '離開時間': fmt(exit), '停留秒數': Math.round((exit - s.entry) / 1000),
      '軌跡點數': s.track.length, '進入緯度': f.lat, '進入經度': f.lon}; });
  const trk = []; list.forEach(s => s.track.forEach(p => trk.push({'車牌號碼': s.plate, '業者代碼': s.operator, '時間': fmt(p.t), '緯度': p.lat, '經度': p.lon})));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(main), '進出紀錄');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(trk), '軌跡點');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet((area?.poly || pts).map((p, i) => ({'頂點': i + 1, '緯度': p[0], '經度': p[1]}))), '範圍頂點');
  XLSX.writeFile(wb, `bus_area_${stamp()}.xlsx`);
};
</script>
</body>
</html>
